<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error - YTFY</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'spotify': '#1DB954',
                            'dark': '#191414',
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="bg-dark min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <div class="w-full max-w-md sm:max-w-lg">
            <div class="bg-white/10 backdrop-blur-sm rounded-2xl shadow-2xl p-6 sm:p-8 lg:p-10">
                <!-- Error Icon -->
                <div class="text-center mb-6">
                    <div class="inline-block p-4 bg-red-500/20 rounded-full mb-4">
                        <svg class="w-12 h-12 sm:w-16 sm:h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-white mb-4">Oops! Something went wrong</h1>
                </div>

                <!-- Error Message -->
                <div class="bg-red-500/10 border-2 border-red-500/50 rounded-lg p-4 sm:p-6 mb-6">
                    <p class="text-red-400 text-sm sm:text-base text-center">{{ error }}</p>
                </div>

                <!-- Try Again Button -->
                <a href="{{ url_for('index') }}" class="block w-full bg-spotify hover:bg-green-500 text-white font-bold py-3 sm:py-4 px-6 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg text-center text-sm sm:text-base mb-6">
                    Try Again
                </a>

                <!-- Footer -->
                <div class="mt-6 pt-6 border-t border-gray-700 text-center space-y-2">
                    <p class="text-gray-400 text-xs sm:text-sm">
                        © 2025 Crafted when I was *definitely* supposed to be working 💻 by 
                        <a href="https://snsyaqirah.github.io/syaqi/" target="_blank" class="text-spotify hover:text-green-400 transition font-medium">Syaqi</a>
                    </p>
                    <a href="{{ url_for('privacy') }}" class="inline-block text-gray-400 hover:text-white transition text-xs sm:text-sm">Privacy Policy</a>
                </div>
            </div>
        </div>
    </body>
</html>
